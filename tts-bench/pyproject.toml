[project]
name = "tts-bench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
