# Single source of truth for model IDs, voices, limits and prices.
# Every value marked VERIFY must be confirmed against the provider's docs/API before a run.
# price_checked: record the date you read the pricing page.

defaults:
  language: bn-BD
  output_sample_rate: 24000

providers:
  gemini:
    docs: https://docs.cloud.google.com/text-to-speech/docs/gemini-tts
    model_docs: https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash-tts
    # Auth: ADC (job service account), no secret. Called via google-genai
    # (Client(enterprise=True)) models.generate_content / generate_content_stream.
    # Facts read 2026-10-07. gemini-3.8-flash-tts is not yet on the Cloud TTS docs page (which lists
    # 2.5 / 3.1-preview models; bn-BD GA) but is in the model page (Bengali in the 130+ languages);
    # the model detects language itself. The cloud docs list a per-field limit of 4000 *bytes* for
    # the Cloud TTS API; Bangla is 3 bytes/char, so confirm whether the genai route has the same limit.
    language_code: bn-BD           # sent as speech_config.language_code (VERIFY the 3.8 model accepts it)
    location: global
    model: gemini-3.8-flash-tts
    voice: {id: Kore, name: Kore}  # prebuilt voice (F); add a Charon (M) config for a male run
    output_format: wav_24000       # model returns WAV/RIFF (24 kHz); stream chunks are re-wrapped as WAV
    max_chars: 4000                # VERIFY (model limit is 8192 tokens)
    price: {unit: VERIFY, usd_per_unit: VERIFY, price_checked: null}

  azure:
    docs: https://learn.microsoft.com/azure/ai-services/speech-service/language-support
    secrets: [AZURE_SPEECH_KEY, AZURE_SPEECH_REGION]
    language_code: bn-BD
    voices: [bn-BD-NabanitaNeural, bn-BD-PradeepNeural]   # VERIFY via voices/list
    output: {format: Riff24Khz16BitMonoPcm}
    max_concurrency: 10           # depends on S0 tier — VERIFY
    max_chars: 5000               # VERIFY
    price: {unit: per_1m_chars, usd_per_unit: VERIFY, price_checked: null}

  elevenlabs:
    docs: https://elevenlabs.io/docs/overview/models
    api_docs: https://elevenlabs.io/docs/api-reference/text-to-speech/convert
    # API key: ELEVENLABS_API_KEY in .env. Called via the elevenlabs SDK text_to_speech.convert().
    language_code: bn
    # Model ID, Bengali support and max_chars from the models docs page (read 2026-10-02).
    model: eleven_v4
    voice: {id: JBFqnCBsd6RMkjVDRZzb, name: george}   # library voice; accent is a confound
    output_format: mp3_44100_128
    voice_settings: {stability: 0.1, similarity_boost: 0.75}   # non-default, by choice
    max_chars: 10000
    price: {unit: per_1m_chars, usd_per_unit: VERIFY, price_checked: null}

  sarvam:
    docs: https://docs.sarvam.ai/api-reference-docs/text-to-speech/convert
    limits_docs: https://docs.sarvam.ai/api-reference-docs/getting-started/pricing
    # API key: SARVAM_API_KEY in .env. Facts below read from the docs on 2026-10-02.
    bangla_support: bn-IN only     # Indian Bengali; bn-BD is not listed — flag accent in the report
    language_code: bn-IN
    model: bulbul:v3               # max 2500 chars (bulbul:v2: 1500)
    voice: {id: shubh, name: shubh}   # v3 default speaker; voices are not language-specific
    output_format: wav_24000       # output_audio_codec=wav, speech_sample_rate=24000 (API defaults)
    max_chars: 2500
    # Starter plan: 30 req/min for bulbul:v3; 429s are retried with backoff.
    price: {unit: per_1m_chars, usd_per_unit: VERIFY, price_checked: null}   # not on the public docs page

  cartesia:
    docs: https://docs.cartesia.ai/build-with-cartesia/tts-models/latest
    api_docs: https://docs.cartesia.ai/api-reference/tts/bytes
    # API key: CARTESIA_API_KEY in .env. Called via the official `cartesia` SDK (tts.generate / tts.generate_sse).
    # Facts read 2026-10-07: Bengali (bn) is listed for sonic-3.6 (44 languages); the SDK sends
    # `Cartesia-Version: 2026-08-14` itself (the only valid value today). The user's emotion tags
    # (`<emotion .../>`, `<speed .../>`, `<break .../>`) are Sonic-3 transcript tags; docs say emotion is English-only.
    api_version: "2026-08-14"
    language_code: bn              # `language` param; bn-BD as a `locale` is not documented
    model: sonic-3.6
    # No Bengali-specific voices are documented. Pick one: `Cartesia().voices.list(language="bn")`
    # (or any multilingual voice) and record the id + the reason here. Run is blocked until then.
    voice: {id: VERIFY_voice_id, name: VERIFY_voice_name}
    output_format: wav_24000       # batch: container wav, pcm_s16le, 24 kHz
    # SSE documents only raw encodings, so streaming asks for raw pcm_s16le and the runner wraps it as WAV.
    stream: {output_format: pcm_24000}
    # No max input length is documented; the longest dataset item is well under any plausible limit.
    # Concurrency by plan: Free 2, Pro 3, Startup 5, Scale 15 (we use 1).
    # Pricing (cartesia.ai/pricing, read 2026-10-07): 1 credit = 1 character. Overage per 1M credits:
    # Pro $65, Startup $45, Scale $38; effective included rate Pro $50, Startup ~$39.2, Scale ~$37.4.
    # Set usd_per_unit for YOUR plan.
    price: {unit: per_1m_chars, usd_per_unit: VERIFY, price_checked: null}

  openai:
    docs: https://developers.openai.com/api/docs/guides/text-to-speech
    api_docs: https://developers.openai.com/api/reference/resources/audio/subresources/speech/methods/create
    bangla_support: unofficial     # Bengali is NOT in the docs' TTS language list (Hindi/Marathi/Tamil... are)
    # API key: OPENAI_API_KEY in .env. Called via the official `openai` SDK (audio.speech). Facts read 2026-10-07.
    # No language parameter: the model infers it from the text. `instructions` is left unset (baseline).
    model: gpt-4o-mini-tts         # snapshot gpt-4o-mini-tts-2025-12-15 is the current default
    voice: {id: alloy, name: alloy}   # add an onyx (M) config for a male run
    output_format: wav_24000       # batch: response_format=wav (docs: PCM is 24 kHz 16-bit; WAV header to be checked)
    stream: {output_format: pcm_24000}   # streamed WAV headers are unverified, so stream raw PCM and wrap it
    max_chars: 4096                # reference page; the model page says a 2000-token limit, and Bangla is token-heavy: VERIFY
    # Tokens, not characters: text input $0.60 / 1M tokens, audio output $12.00 / 1M tokens (model page, read
    # 2026-10-07; the pricing page's unit for audio output is unclear). est_cost_usd stays null until set.
    price: {unit: VERIFY, usd_per_unit: VERIFY, price_checked: null}

  soniox:
    docs: https://soniox.com/docs/tts/get-started
    api_docs: https://soniox.com/docs/api-reference/tts/generate_tts
    # API key: SONIOX_API_KEY in .env. Called via the official `soniox` SDK (tts.generate / realtime.tts). Facts read 2026-10-07.
    # Bengali (bn) is officially supported; `bn-BD` is not documented. Every voice works with every language.
    language_code: bn
    model: tts-rt-v2               # tts-rt-v1 is deprecated; always pass the model (the REST default is still v1)
    voice: {id: Adrian, name: Adrian}   # from the official examples; list voices via GET /v1/tts-models
    output_format: wav_24000       # batch: audio_format=wav, sample_rate=24000 (WAV encoding to be checked)
    stream: {output_format: pcm_24000}   # realtime stream: pcm_s16le, wrapped as WAV by the runner
    max_chars: 5000                # REST text maxLength; audio is capped at 2 minutes per request
    # Limits: 100 req/min, 3 concurrent (we use 1).
    # Tokens, not characters: text input $4.00 / 1M tokens (~0.3 tokens/char), audio output $21.50 / 1M tokens
    # (~$0.70 per hour of speech) (soniox.com/pricing, read 2026-10-07). Bengali tokenisation: VERIFY.
    price: {unit: VERIFY, usd_per_unit: VERIFY, price_checked: null}

  indicf5:
    docs: https://huggingface.co/ai4bharat/IndicF5
    secrets: [HF_TOKEN]
    self_hosted: true
    license_note: "Commercial use restricted — flag in report"
    models: [ai4bharat/IndicF5]
    voices:                        # reference prompts on the dataset bucket
      - {name: bd_female_01, ref_audio: reference_audio/bd_female_01.wav, ref_text: reference_audio/bd_female_01.txt}
      - {name: bd_male_01,   ref_audio: reference_audio/bd_male_01.wav,   ref_text: reference_audio/bd_male_01.txt}
    gpu: nvidia-l4
    max_concurrency: 1
    price: {unit: gpu_hour, usd_per_unit: VERIFY, price_checked: null}
